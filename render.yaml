# render.yaml — Blueprint deploy Render untuk "Ayo, Moana Belajar!"
#
# Cara pakai:
#   1. Push repo ini ke GitHub.
#   2. Di dashboard Render: New > Blueprint, pilih repo ini.
#   3. Isi env var di bawah (ANTHROPIC_API_KEY wajib).
#
# Catatan: WhatsApp bot memakai library tidak resmi (Neonize). File sesi
# wa_session.db tersimpan di filesystem service — untuk 24/7 yang stabil
# gunakan plan berbayar (filesystem persisten).
#
# Keep-alive: sejak v1.4.1 bot mem-ping /health sendiri tiap 10 menit
# (membaca RENDER_EXTERNAL_URL otomatis), sehingga service free tier tidak
# tertidur setelah 15 menit idle. Tambahan opsional: UptimeRobot ke /health.

services:
  # ---------- Bot WhatsApp ----------
  - type: web
    name: ayomoana-whatsapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 whatsapp_bot.py
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # isi manual di dashboard (secret)
      - key: WA_SESSION_DB
        value: wa_session.db
      - key: WA_QR_TOKEN
        sync: false          # isi manual: string acak panjang untuk melindungi /qr
      - key: DATABASE_URL
        sync: false          # opsional: PostgreSQL yang dipakai bot Telegram
      - key: RENDER_EXTERNAL_URL
        sync: false          # diisi otomatis oleh Render (dipakai keep-alive)

  # ---------- Bot Telegram ----------
  # Nama service ini HARUS sama dengan service yang sudah ada di dashboard
  # (ayomoanabelajar-bot), supaya kalau Blueprint dijalankan ulang, Render
  # memperbarui service yang sama alih-alih membuat duplikat baru.
  # Catatan: PTB webhook tidak punya endpoint /health, jadi healthCheckPath
  # tidak dipakai.
  - type: web
    name: ayomoanabelajar-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 telegram_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false          # opsional: untuk mode suara (transkripsi voice note)
      - key: DATABASE_URL
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
